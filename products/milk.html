<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Fresh Milk</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="wrap header-inner">

            <a href="../index.html" class="logo">
                Whitegate Dairy Co.
            </a>

            <a href="../cart.html" class="cart-link">
                Cart
            </a>

        </div>
    </header>


    <!-- Product Details -->
    <section class="product-detail">

        <div class="wrap product-detail-grid">

            <!-- Product Image -->
            <div>
                <img
                    src="../images/milk.jpg"
                    alt="Fresh Milk"
                    class="product-detail-image"
                >
            </div>


            <!-- Product Information -->
            <div>

                <h1>Farm Fresh Milk</h1>

                <p class="detail-price">
                    ₹60 / 1 Litre
                </p>

                <p>
                    Fresh cow milk collected every morning
                    from our own dairy farm.
                    Packed and delivered within hours.
                    No preservatives.
                </p>

                <h3>Product Highlights</h3>

                <ul>
                    <li>100% Pure Milk</li>
                    <li>No Preservatives</li>
                    <li>Morning Collection</li>
                    <li>Farm Direct</li>
                </ul>

                <button
                    class="btn btn-primary"
                    onclick="addToCart()">
                    Add To Cart
                </button>

            </div>

        </div>

    </section>


    <!-- Add To Cart -->
    <script>

        function addToCart() {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const product = {

                id: 1,

                name: "Farm Fresh Milk",

                description:
                    "Pure cow milk collected every morning.",

                price: 60,

                unit: "1 Litre",

                image: "../images/milk.jpg",

                quantity: 1

            };


            const existing =
                cart.find(
                    item => item.id === 1
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push(product);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert("Farm Fresh Milk added to cart");

        }

    </script>

</body>

</html>
